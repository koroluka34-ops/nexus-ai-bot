name: Build NEXUS PHONE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "phone-app/**"
      - ".github/workflows/build-phone-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p phone-app assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-debug-apk
          path: phone-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
