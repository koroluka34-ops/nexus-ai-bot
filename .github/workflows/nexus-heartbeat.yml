name: NEXUS autonomous heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake NEXUS and process queued tasks
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 150 \
            https://nexus-ai-bot-kt4w.onrender.com/heartbeat
